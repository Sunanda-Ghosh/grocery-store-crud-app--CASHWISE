<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>New purchase</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/operations.css"></head>
<body><div class="page-shell"><header class="topbar"><a class="brand" href="/">Loading store...</a><nav class="screen-nav"><a href="/sale.html">New sale</a><a href="/stock.html">Stock</a><a href="/suppliers.html">Suppliers</a><a class="back-link" href="/">Home</a></nav></header>
<main><div class="page-heading"><div><p class="eyebrow">Stock coming in</p><h1>New purchase</h1><p class="intro">Record a delivery while the details are fresh.</p></div></div><p id="purchase-message" class="message" hidden></p>
<form id="purchase-form" class="card purchase-form"><div class="form-grid"><label class="field">Supplier<select id="supplier" class="form-select" required><option value="">Loading suppliers...</option></select></label><label class="field">Purchase date<input id="purchase-date" class="form-input" type="date" required></label></div><div id="purchase-rows"></div><button id="add-purchase-row" class="add-button" type="button" disabled>+ Add product</button><div class="purchase-summary"><div><span class="muted">Preview total</span><div id="purchase-total" class="purchase-total">₹0.00</div></div></div><button id="record-purchase" class="primary-button" type="submit" disabled><i class="icon" data-lucide="truck"></i> Record purchase</button></form><section id="purchase-confirmation" class="card confirmation-card" hidden><div class="confirmation-heading"><i class="icon" data-lucide="circle-check"></i><span>Purchase recorded</span></div><p id="purchase-confirmed-copy" class="muted"></p></section></main></div><script src="https://unpkg.com/lucide@latest"></script><script src="/guard.js"></script><script src="/purchase.js"></script></body></html>
