<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reset password | CashWise</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/auth.css"></head>
<body><main class="auth-shell"><a class="brand" href="/">CashWise</a><section class="auth-card"><p class="eyebrow">Account recovery</p><h1>Reset password</h1><p class="intro">Request a code, then choose a new password.</p><p id="reset-message" class="message" role="status" hidden></p><form id="request-form" class="form"><label>Email<input name="email" type="email" autocomplete="email" required></label><button type="submit">Email me a code</button></form><form id="reset-form" class="form" hidden><label>Six-digit code<input name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><label>New password<input name="new_password" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirm new password<input name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></label><button type="submit">Reset password</button></form><p class="auth-link"><a href="/login.html">Back to log in</a></p></section></main><script src="/forgot-password.js"></script></body></html>
