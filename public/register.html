<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create account | CashWise</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/auth.css"></head>
<body><main class="auth-shell"><a class="brand" href="/">CashWise</a><section class="auth-card"><p class="eyebrow">A new beginning</p><h1>Create account</h1><p class="intro">Set up your own store space.</p><p id="auth-error" class="message error" role="alert" hidden></p><form id="auth-form" class="form" data-endpoint="/auth/register"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><label>Store name<input name="store_name" type="text" maxlength="120" autocomplete="organization" required></label><button type="submit">Create account</button></form><p class="auth-link">Already have an account? <a href="/login.html">Log in</a></p></section></main><script src="/auth.js"></script></body></html>
