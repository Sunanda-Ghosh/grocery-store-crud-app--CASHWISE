<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Profile | CashWise</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/operations.css"></head>
<body><div class="page-shell"><header class="topbar"><a class="brand" href="/">CashWise</a><nav class="screen-nav"><a href="/stock.html">Stock</a><a href="/suppliers.html">Suppliers</a><a href="/reports.html">Reports</a><a class="back-link" href="/">Home</a></nav></header><main><div class="page-heading"><div><p class="eyebrow">Your account</p><h1>Profile</h1><p class="intro">Your store identity and session.</p></div></div><p id="profile-error" class="message error-message" role="alert" hidden></p><p id="profile-success" class="message status-message" role="status" hidden></p><section class="card detail-card"><h2 id="profile-store">Loading store...</h2><p id="profile-email" class="muted"></p><button id="logout" class="secondary-button" type="button" style="margin-top: 22px"><i class="icon" data-lucide="log-out"></i> Log out</button></section><div class="profile-grid"><section class="card profile-panel"><p class="eyebrow">Store details</p><h2>Update profile</h2><form id="profile-form" class="profile-form"><label class="field">Store name<input class="form-input" name="store_name" type="text" maxlength="120" autocomplete="organization" required></label><button class="primary-button" type="submit">Save changes</button></form></section><section class="card profile-panel"><p class="eyebrow">Security</p><h2>Change password</h2><form id="password-form" class="profile-form"><label class="field">Current password<input class="form-input" name="current_password" type="password" autocomplete="current-password" required></label><label class="field">New password<input class="form-input" name="new_password" type="password" minlength="8" autocomplete="new-password" required></label><label class="field">Confirm new password<input class="form-input" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></label><button class="primary-button" type="submit">Change password</button></form></section></div></main></div><script src="https://unpkg.com/lucide@latest"></script><script src="/profile.js"></script></body></html>
