<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Log in | CashWise</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/auth.css"></head>
<body><main class="auth-shell"><a class="brand" href="/">CashWise</a><section class="auth-card"><p class="eyebrow">Welcome back</p><h1>Log in</h1><p class="intro">Pick up where your store left off.</p><p id="auth-error" class="message error" role="alert" hidden></p><form id="auth-form" class="form" data-endpoint="/auth/login"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Log in</button></form><p class="auth-link"><a href="/forgot-password.html">Forgot password?</a></p><p class="auth-link">New store owner? <a href="/register.html">Create an account</a></p></section></main><script src="/auth.js"></script></body></html>
